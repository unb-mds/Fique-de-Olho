services:
  db:
    image: postgres:16-alpine
    container_name: fiquedeolho_db
    restart: always
    environment:
      POSTGRES_USER: fiquedeolho
      POSTGRES_PASSWORD: fiquedeolho
      POSTGRES_DB: fiquedeolho_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiquedeolho -d fiquedeolho_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiquedeolho_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PROJECT_NAME=Fique de Olho API
      - VERSION=0.1.0
      - DATABASE_URL=postgresql://fiquedeolho:fiquedeolho@db:5432/fiquedeolho_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
