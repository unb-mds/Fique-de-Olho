services:
  - type: web
    name: fique-de-olho-api
    runtime: docker
    region: ohio
    plan: free
    rootDir: Back
    dockerfilePath: Dockerfile
    healthCheckPath: /ping
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: NOTIFICATION_SCHEDULER_ENABLED
        value: "true"
      - key: NOTIFICATION_SCHEDULER_INTERVAL_SECONDS
        value: "3600"
