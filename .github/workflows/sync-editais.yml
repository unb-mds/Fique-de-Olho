name: Coleta Periódica de Editais

on:
  schedule:
    # Roda 2x ao dia: 06:00 e 18:00 no horário de Brasília (UTC-3)
    - cron: "0 9,21 * * *"
  workflow_dispatch:
    inputs:
      orgaos:
        description: "Siglas dos órgãos separadas por vírgula (ex.: DEG,DAC). Deixe vazio para todos."
        required: false
        default: ""
      max_items_per_orgao:
        description: "Máximo de editais por portal"
        required: false
        default: "100"

permissions:
  contents: read

concurrency:
  group: sync-editais
  cancel-in-progress: false

jobs:
  sync:
    name: Sincronizar portais da UnB e gerar resumos
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Back/requirements.txt

      - name: Instalar dependências do backend
        run: |
          python -m pip install --upgrade pip
          pip install -r Back/requirements.txt

      - name: Validar configuração de secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL não configurado em Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::Secret GEMINI_API_KEY não configurado; a coleta usará apenas a heurística local (Camada 1)."
          fi

      - name: Garantir migrations aplicadas
        working-directory: Back
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head

      - name: Executar ciclo de coleta e enriquecimento
        working-directory: Back
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-flash-lite-latest' }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          SYNC_ORGAOS: ${{ github.event.inputs.orgaos }}
          SYNC_MAX_ITEMS: ${{ github.event.inputs.max_items_per_orgao || '100' }}
        run: |
          python - <<'PY'
          import logging
          import os
          import sys

          from app.modules.scraper.scheduler import executar_ciclo_scraping

          logging.basicConfig(
              level=logging.INFO,
              format="%(asctime)s [%(levelname)s] %(name)s: %(message)s",
          )

          raw_orgaos = os.environ.get("SYNC_ORGAOS", "").strip()
          orgaos = [s.strip().upper() for s in raw_orgaos.split(",") if s.strip()] or None
          raw_max = os.environ.get("SYNC_MAX_ITEMS", "100").strip()
          max_items = int(raw_max) if raw_max.isdigit() and int(raw_max) > 0 else 100

          resultado = executar_ciclo_scraping(
              orgaos=orgaos,
              max_items_per_orgao=max_items,
              fetch_docs=True,
              enable_pdf_enrichment=True,
          )

          status = resultado.get("status")
          print(
              f"Resumo da coleta: status={status} | "
              f"portais={resultado.get('portais_processados', 0)} | "
              f"encontrados={resultado.get('editais_encontrados', 0)} | "
              f"novos={resultado.get('novos_editais', 0)} | "
              f"atualizados={resultado.get('editais_atualizados', 0)}",
              flush=True,
          )

          portais = resultado.get("portais") or {}
          erros = {sigla: info.get("erro") for sigla, info in portais.items() if info.get("status") == "error"}
          if erros:
              print(f"Portais com erro ({len(erros)}): {erros}", flush=True)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("## Coleta Periódica de Editais\n\n")
                  fh.write(f"- **Status:** `{status}`\n")
                  fh.write(f"- **Portais processados:** {resultado.get('portais_processados', 0)}\n")
                  fh.write(f"- **Editais encontrados:** {resultado.get('editais_encontrados', 0)}\n")
                  fh.write(f"- **Novos editais:** {resultado.get('novos_editais', 0)}\n")
                  fh.write(f"- **Editais atualizados:** {resultado.get('editais_atualizados', 0)}\n")
                  if erros:
                      fh.write(f"- **Portais com erro ({len(erros)}):** {', '.join(sorted(erros))}\n")

          if status == "error":
              print(f"::error::Falha geral no ciclo de coleta: {resultado.get('erro')}", flush=True)
              sys.exit(1)
          PY
