name: Pipeline CI

on:
  push:
    branches:
      - main
      - Dev
  pull_request:
    branches:
      - main
      - Dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Front/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: Front
        run: npm ci

      - name: Executar build do frontend
        working-directory: Front
        run: npm run build

  test-backend:
    name: Testes automatizados do backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fique_de_olho
          POSTGRES_PASSWORD: fique_de_olho_dev
          POSTGRES_DB: fique_de_olho
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Back/requirements.txt

      - name: Instalar dependências do backend
        run: |
          python -m pip install --upgrade pip
          pip install -r Back/requirements.txt

      - name: Executar migrations do banco
        working-directory: Back
        env:
          DATABASE_URL: postgresql+psycopg2://fique_de_olho:fique_de_olho_dev@localhost:5432/fique_de_olho
        run: alembic upgrade head

      - name: Popular dados de teste (seeds)
        env:
          PGPASSWORD: fique_de_olho_dev
        run: |
          psql -h localhost -U fique_de_olho -d fique_de_olho -f db/migrations/002_seed_catalogos.sql
          psql -h localhost -U fique_de_olho -d fique_de_olho -f db/migrations/003_seed_editais.sql

      - name: Executar testes com pytest
        working-directory: Back
        env:
          DATABASE_URL: postgresql+psycopg2://fique_de_olho:fique_de_olho_dev@localhost:5432/fique_de_olho
          JWT_SECRET_KEY: test-secret-key-ci
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 1440
        run: pytest tests -v

  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Construir imagem Docker do backend
        run: docker build --tag fique-de-olho-backend:ci ./Back

