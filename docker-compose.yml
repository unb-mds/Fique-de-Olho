services:
  front:
    build:
      context: ./Front
      dockerfile: Dockerfile
    container_name: fique-de-olho-front
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./Front:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_started

  db:
    image: postgres:16-alpine
    container_name: fique-de-olho-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fique_de_olho}
      POSTGRES_USER: ${POSTGRES_USER:-fique_de_olho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fique_de_olho_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      #Essa linha de baixo cria o banco de dados antes do alembic e isso gera conflito 
      #- ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./Back
      dockerfile: Dockerfile
    container_name: fique-de-olho-api
    restart: unless-stopped
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./Back:/app
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-Fique de Olho API}
      VERSION: ${VERSION:-0.1.0}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fique_de_olho}:${POSTGRES_PASSWORD:-fique_de_olho_dev}@db:5432/${POSTGRES_DB:-fique_de_olho}
      SCRAPER_SCHEDULER_ENABLED: "true"
      SCRAPER_SCHEDULER_RUN_ON_STARTUP: "false"
      SCRAPER_SCHEDULER_INTERVAL_HOURS: "12"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: