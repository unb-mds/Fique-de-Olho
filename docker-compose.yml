services:
  db:
    image: postgres:16-alpine
    container_name: fique-de-olho-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fique_de_olho}
      POSTGRES_USER: ${POSTGRES_USER:-fique_de_olho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fique_de_olho_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: