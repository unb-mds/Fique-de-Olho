services:
  db:
    image: postgres:16-alpine
    container_name: fique-de-olho-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fique_de_olho}
      POSTGRES_USER: ${POSTGRES_USER:-fique_de_olho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fique_de_olho_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./Back
      dockerfile: Dockerfile
    container_name: fique-de-olho-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./Back:/app
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-Fique de Olho API}
      VERSION: ${VERSION:-0.1.0}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fique_de_olho}:${POSTGRES_PASSWORD:-fique_de_olho_dev}@db:5432/${POSTGRES_DB:-fique_de_olho}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: